<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Borda do prompt — validação da implementação</title>
<style>body{background:#181818;color:#eee;font:16px system-ui;margin:24px}select{font:inherit;margin:8px;padding:6px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}figure{margin:0}img{width:100%;border:1px solid #555}figcaption{padding:8px}a{color:#a9d7ff}@media(max-width:900px){main{grid-template-columns:1fr}}</style>
<h1>Borda do prompt: baseline, candidato aprovado e implementação</h1>
<p>Capturas reais da mesma instância temporária: VS Code 1.146.0 / Claude Code 2.1.325. Selecione um estado e abra cada imagem para inspecionar em tamanho original. As imagens não foram reconstruídas ou retocadas.</p>
<label>Tema <select id="theme"><option value="monomin">MonoMin</option><option value="monodracula">MonoDracula</option></select></label>
<label>Estado <select id="state"><option value="blur">Desfocado</option><option value="hover">Hover</option><option value="manual-focus">Foco Manual</option><option value="plan-focus">Foco Plan</option><option value="auto-focus">Foco Auto / botão vazio desabilitado</option><option value="auto-enabled">Auto com rascunho não enviado</option><option value="code">Código e copiar em hover</option><option value="native">Search nativo</option><option value="editor">Estilos do editor</option></select></label>
<main id="images"></main><p><a href="README.md">Relatório e limitações</a></p>
<script>const themeSelect=document.getElementById('theme'),stateSelect=document.getElementById('state'),container=document.getElementById('images');function update(){container.replaceChildren();for(const [phase,label]of [['baseline','Baseline anterior'],['approved','Candidato aprovado (override temporário)'],['current','Tema atualizado (sem override)']]){const figure=document.createElement('figure'),caption=document.createElement('figcaption'),link=document.createElement('a'),img=document.createElement('img');caption.textContent=label;img.src=link.href='evidence/'+themeSelect.value+'-'+phase+'-'+stateSelect.value+'.png';img.alt=label;link.append(img);figure.append(caption,link);container.append(figure);}}themeSelect.addEventListener('input',update);stateSelect.addEventListener('input',update);update();</script></html>
